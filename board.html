<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>창순기획 응답 아카이브</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#060B14;
    --void-2:#0B1524;
    --panel: rgba(13,23,38,.72);
    --cyan:#4CF3FF;
    --cyan-soft: rgba(76,243,255,.35);
    --ink:#E7FBFF;
    --muted:#6F8CA0;
    --err:#FF4B5C;
    --improve:#33F0B8;
    --etc:#9AA8FF;
    --tip:#FFC94C;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
    background:var(--void);
    overflow-x:hidden;
    padding:34px 16px 60px;
    position:relative;
  }

  .hud-bg{
    position:fixed; inset:0; z-index:-1; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(76,243,255,.14), transparent 55%),
      repeating-linear-gradient(0deg, rgba(76,243,255,.035) 0px, rgba(76,243,255,.035) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(76,243,255,.03) 0px, rgba(76,243,255,.03) 1px, transparent 1px, transparent 42px),
      var(--void);
  }
  .hud-bg::after{
    content:'';
    position:absolute; left:0; right:0; top:-140px; height:140px;
    background:linear-gradient(180deg, transparent, rgba(76,243,255,.16), transparent);
    animation:scan 7s linear infinite;
  }
  @keyframes scan{ 0%{ top:-140px; } 100%{ top:100%; } }

  .page{ max-width:520px; margin:0 auto; }

  .hud-tag{
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    letter-spacing:.18em; color:var(--cyan); text-align:center;
    text-shadow:0 0 10px var(--cyan-soft);
  }
  h1{
    text-align:center; font-weight:800; font-size:26px; margin:8px 0 10px; letter-spacing:-.01em;
    background:linear-gradient(90deg,#fff,var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(76,243,255,.35));
  }
  .hud-status{
    text-align:center; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);
    display:flex; justify-content:center; align-items:center; gap:7px; margin-bottom:28px;
  }
  .dot{
    width:7px; height:7px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 8px 2px var(--cyan-soft); animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }

  .filter-ring{
    display:flex; gap:9px; overflow-x:auto; padding:4px 2px 8px;
    margin-bottom:26px; justify-content:center; flex-wrap:wrap; scrollbar-width:none;
  }
  .filter-ring::-webkit-scrollbar{ display:none; }
  .hud-chip{
    position:relative; display:flex; align-items:center; gap:7px;
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; letter-spacing:.02em;
    color:var(--muted); background:rgba(13,23,38,.65); border:1px solid rgba(76,243,255,.18);
    padding:9px 14px 9px 10px; border-radius:999px; cursor:pointer;
    transition:color .2s ease, border-color .2s ease;
  }
  .chip-orb{ width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.5; }
  .hud-chip:hover{ color:var(--ink); border-color:var(--cyan-soft); }
  .hud-chip[data-cat="전체"]{ --c: var(--cyan); }
  .hud-chip[data-cat="오류사항"]{ --c: var(--err); }
  .hud-chip[data-cat="개선요청"]{ --c: var(--improve); }
  .hud-chip[data-cat="기타"]{ --c: var(--etc); }
  .hud-chip[data-cat="우수 활용팁 공유"]{ --c: var(--tip); }
  .hud-chip.active{ color:var(--c); border-color:var(--c); }
  .hud-chip.active .chip-orb{ opacity:1; box-shadow:0 0 8px 2px var(--c); }
  .hud-chip.active::before{
    content:''; position:absolute; inset:-3px; border-radius:999px; z-index:-1; opacity:.55;
    background:conic-gradient(from 0deg, transparent 0 70%, var(--c) 88%, transparent 100%);
    animation:spin 2.6s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .viewer{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .viewer-frame{
    position:relative; width:100%; min-height:360px;
    background:var(--panel); border:1px solid rgba(76,243,255,.25); border-radius:16px;
    backdrop-filter:blur(6px);
    box-shadow:0 0 40px -14px rgba(76,243,255,.3), inset 0 0 40px -22px rgba(76,243,255,.2);
    padding:30px 24px; display:flex; align-items:center; justify-content:center;
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  .viewer-frame.alert{
    border-color:rgba(255,75,92,.5);
    box-shadow:0 0 40px -14px rgba(255,75,92,.35), inset 0 0 40px -22px rgba(255,75,92,.2);
  }
  .corner{ position:absolute; width:18px; height:18px; border:2px solid var(--cyan); opacity:.85; }
  .corner.tl{ top:-1px; left:-1px; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  .corner.tr{ top:-1px; right:-1px; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
  .corner.bl{ bottom:-1px; left:-1px; border-right:none; border-top:none; border-radius:0 0 0 6px; }
  .corner.br{ bottom:-1px; right:-1px; border-left:none; border-top:none; border-radius:0 0 6px 0; }

  .viewer-body{ width:100%; }

  .idle-state{ text-align:center; }
  .reactor{ position:relative; width:92px; height:92px; margin:0 auto 20px; }
  .reactor .ring{ position:absolute; inset:0; border-radius:50%; border:2px solid transparent; }
  .reactor .r1{ border-top-color:var(--cyan); border-right-color:var(--cyan); animation:spin 2.2s linear infinite; }
  .reactor .r2{ inset:14px; border-bottom-color:var(--cyan); border-left-color:var(--cyan); opacity:.6; animation:spin 3.2s linear infinite reverse; }
  .reactor .core{
    position:absolute; inset:33px; border-radius:50%;
    background:radial-gradient(circle, #fff, var(--cyan) 55%, transparent 75%);
    box-shadow:0 0 30px 6px var(--cyan-soft); animation:pulse 1.8s ease-in-out infinite;
  }
  .reactor.fast .r1{ animation-duration:.85s; }
  .reactor.fast .r2{ animation-duration:1.3s; }

  .idle-text{
    font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:.04em;
    color:var(--muted); margin:0 0 20px; line-height:1.7;
  }
  .idle-text strong{ color:var(--cyan); font-size:15px; }
  .idle-state.error .idle-text{ color:var(--err); }

  .hud-btn{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12.5px; letter-spacing:.03em;
    padding:13px 24px; border-radius:9px; cursor:pointer; display:inline-block; border:none;
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .hud-btn.primary{
    background:linear-gradient(135deg, var(--cyan), #1B8FA6); color:#01202A;
    box-shadow:0 0 26px -6px var(--cyan-soft);
  }
  .hud-btn.primary:hover{ transform:translateY(-2px); filter:brightness(1.05); }
  .hud-btn.ghost{
    background:transparent; border:1.5px solid var(--cyan-soft); color:var(--cyan); margin-top:20px;
  }
  .hud-btn.ghost:hover{ background:rgba(76,243,255,.08); }

  .response-card{ width:100%; text-align:left; animation:fadeUp .45s ease; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
  .response-tag{
    display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace;
    font-size:11px; font-weight:700; letter-spacing:.04em; padding:5px 12px; border-radius:999px;
    color:#01141a; background:var(--tag-color); box-shadow:0 0 16px -2px var(--tag-color); margin-bottom:12px;
  }
  .response-meta{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted); margin-bottom:16px; }
  .response-content{
    font-size:14.5px; line-height:1.75; color:var(--ink); min-height:70px;
    white-space:pre-wrap; word-break:break-word;
  }
  .response-content .cursor{
    display:inline-block; width:2px; height:1em; background:var(--cyan); margin-left:2px;
    vertical-align:-2px; animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .response-actions{ text-align:center; }

  .viewer-index{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); letter-spacing:.05em; }

  .footer-note{
    text-align:center; font-family:'JetBrains Mono', monospace; font-size:10.5px;
    color:var(--muted); margin-top:34px; letter-spacing:.02em;
  }
  .footer-note a{ color:var(--cyan); font-weight:700; text-decoration:none; }
  .footer-note a:hover{ text-decoration:underline; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="hud-bg"></div>
<div class="page">
  <div class="hud-tag">◈ F.E.E.D — FEEDBACK ARCHIVE PROTOCOL</div>
  <h1>응답 아카이브</h1>
  <div class="hud-status"><span class="dot"></span><span id="status-text">SYSTEM INITIALIZING...</span></div>

  <div class="filter-ring" id="filter-ring">
    <button class="hud-chip active" data-cat="전체"><span class="chip-orb"></span>전체</button>
    <button class="hud-chip" data-cat="오류사항"><span class="chip-orb"></span>🐛 오류사항</button>
    <button class="hud-chip" data-cat="개선요청"><span class="chip-orb"></span>💡 개선요청</button>
    <button class="hud-chip" data-cat="기타"><span class="chip-orb"></span>💬 기타</button>
    <button class="hud-chip" data-cat="우수 활용팁 공유"><span class="chip-orb"></span>⭐ 우수 활용팁</button>
  </div>

  <div class="viewer">
    <div class="viewer-frame" id="viewer-frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="viewer-body" id="viewer-body">
        <div class="idle-state">
          <div class="reactor fast"><div class="ring r1"></div><div class="ring r2"></div><div class="core"></div></div>
          <p class="idle-text">데이터 동기화 중...</p>
        </div>
      </div>
    </div>
    <div class="viewer-index" id="viewer-index"></div>
  </div>

  <div class="footer-note"><a href="index.html">← 의견 제출하러 가기</a></div>
</div>

<script>
(function(){
  // ⚠ index.html과 동일한 Apps Script 배포 URL(.../exec)로 교체하세요.
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxZDKg89JG7Ur_hiT61AFrzyPrX6s9pWfIL9uFhSGvlCkBH6uMZx1O2iRkrHjE37KS6yw/exec';

  const CATEGORY_META = {
    '오류사항': { icon:'🐛', color:'var(--err)' },
    '개선요청': { icon:'💡', color:'var(--improve)' },
    '기타': { icon:'💬', color:'var(--etc)' },
    '우수 활용팁 공유': { icon:'⭐', color:'var(--tip)' }
  };
  const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*';
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const statusText = document.getElementById('status-text');
  const filterRing = document.getElementById('filter-ring');
  const viewerFrame = document.getElementById('viewer-frame');
  const viewerBody = document.getElementById('viewer-body');
  const viewerIndex = document.getElementById('viewer-index');

  let allItems = [];
  let filteredItems = [];
  let currentFilter = '전체';
  let currentIndex = -1;

  function formatDate(iso){
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return mm + '.' + dd + ' ' + hh + ':' + mi;
  }
  function pad(n){ return String(n).padStart(2,'0'); }

  function decryptReveal(el, text){
    if (reduceMotion || !text){ el.textContent = text; return; }
    const len = text.length;
    const speed = Math.max(1, Math.ceil(len/40));
    let revealed = 0;
    function frame(){
      revealed = Math.min(len, revealed + speed);
      let out = '';
      for (let i=0;i<len;i++){
        if (i < revealed || text[i] === '\n' || text[i] === ' ') out += text[i];
        else out += GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
      }
      el.textContent = out;
      if (revealed < len) requestAnimationFrame(frame);
      else el.textContent = text;
    }
    frame();
  }

  function setFrameAlert(on){ viewerFrame.classList.toggle('alert', !!on); }

  function renderIdleReady(){
    setFrameAlert(false);
    viewerIndex.textContent = '';
    const count = filteredItems.length;
    viewerBody.innerHTML =
      '<div class="idle-state">' +
        '<div class="reactor"><div class="ring r1"></div><div class="ring r2"></div><div class="core"></div></div>' +
        '<p class="idle-text">◎ <strong>' + count + '</strong>건 매칭됨</p>' +
      '</div>';
    const btn = document.createElement('button');
    btn.className = 'hud-btn primary';
    btn.textContent = count > 0 ? '응답보기' : '매칭된 응답 없음';
    btn.disabled = count === 0;
    btn.addEventListener('click', () => showResponse(0));
    viewerBody.querySelector('.idle-state').appendChild(btn);
  }

  function renderError(msg){
    setFrameAlert(true);
    viewerIndex.textContent = '';
    viewerBody.innerHTML =
      '<div class="idle-state error">' +
        '<p class="idle-text">⚠ ' + msg + '</p>' +
      '</div>';
  }

  function showResponse(index){
    if (filteredItems.length === 0) return;
    currentIndex = ((index % filteredItems.length) + filteredItems.length) % filteredItems.length;
    const item = filteredItems[currentIndex];
    const meta = CATEGORY_META[item.category] || { icon:'💬', color:'var(--cyan)' };
    setFrameAlert(false);

    const card = document.createElement('div');
    card.className = 'response-card';

    const tag = document.createElement('span');
    tag.className = 'response-tag';
    tag.style.setProperty('--tag-color', meta.color);
    tag.textContent = meta.icon + ' ' + item.category;

    const metaLine = document.createElement('div');
    metaLine.className = 'response-meta';
    metaLine.textContent = (item.name || '익명') + ' · ' + formatDate(item.timestamp);

    const content = document.createElement('div');
    content.className = 'response-content';

    const actions = document.createElement('div');
    actions.className = 'response-actions';
    const nextBtn = document.createElement('button');
    nextBtn.className = 'hud-btn ghost';
    nextBtn.textContent = '다른 응답보기 →';
    nextBtn.addEventListener('click', () => showResponse(currentIndex + 1));
    actions.appendChild(nextBtn);

    card.appendChild(tag);
    card.appendChild(metaLine);
    card.appendChild(content);
    card.appendChild(actions);

    viewerBody.innerHTML = '';
    viewerBody.appendChild(card);
    decryptReveal(content, item.content || '');

    viewerIndex.textContent = pad(currentIndex+1) + ' / ' + pad(filteredItems.length);
  }

  function applyFilter(cat){
    currentFilter = cat;
    filteredItems = cat === '전체' ? allItems.slice() : allItems.filter(it => it.category === cat);
    currentIndex = -1;
    renderIdleReady();
  }

  filterRing.querySelectorAll('.hud-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      filterRing.querySelectorAll('.hud-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      applyFilter(chip.dataset.cat);
    });
  });

  function load(){
    statusText.textContent = 'SYSTEM INITIALIZING...';

    if (WEB_APP_URL.indexOf('YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') !== -1){
      statusText.textContent = 'SYSTEM NOT CONFIGURED';
      renderError('WEB_APP_URL 설정이 필요합니다.');
      return;
    }

    fetch(WEB_APP_URL + '?action=list')
      .then(res => res.json())
      .then(data => {
        if (!data.success) throw new Error('load failed');
        allItems = data.items || [];
        statusText.textContent = 'SYSTEM ONLINE · ' + allItems.length + '건 수신됨';
        applyFilter(currentFilter);
      })
      .catch(() => {
        statusText.textContent = 'CONNECTION ERROR';
        renderError('데이터를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
      });
  }

  load();
})();
</script>
</body>
</html>
