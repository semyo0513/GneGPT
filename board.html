<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>창순기획 피드백 게시판</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAEFF6;
    --bg-grid: #DCE3EE;
    --card-bg: #FFFFFF;
    --ink: #1F2937;
    --muted: #6B7280;
    --error-tag: #E0604C;
    --improve-tag: #23928A;
    --etc-tag: #64748B;
    --tip-tag: #D99A2B;
    --accent: #3E4FBF;
    --danger: #C23B33;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 1px) 0 0/22px 22px,
      var(--bg);
    padding:32px 16px 60px;
  }
  .page{ max-width:900px; margin:0 auto; }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; font-weight:700; letter-spacing:.12em;
    color:var(--muted); text-align:center; text-transform:uppercase; margin-bottom:6px;
  }
  h1{ font-size:24px; font-weight:800; letter-spacing:-.01em; text-align:center; margin:0 0 6px; }
  .subtitle{ font-size:13px; color:var(--muted); text-align:center; margin:0 0 24px; line-height:1.5; }

  .controls{
    display:flex; align-items:center; gap:8px;
    overflow-x:auto; padding-bottom:4px; margin-bottom:22px;
    scrollbar-width:none;
  }
  .controls::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex:0 0 auto;
    font-family:'Pretendard', sans-serif;
    font-size:12.5px; font-weight:700;
    padding:8px 14px; border-radius:999px;
    border:1.5px solid #D8DEE9; background:#fff; color:var(--muted);
    cursor:pointer; white-space:nowrap;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .filter-chip.active{ color:#fff; border-color:transparent; }
  .filter-chip[data-cat="전체"].active{ background:var(--accent); }
  .filter-chip[data-cat="오류사항"].active{ background:var(--error-tag); }
  .filter-chip[data-cat="개선요청"].active{ background:var(--improve-tag); }
  .filter-chip[data-cat="기타"].active{ background:var(--etc-tag); }
  .filter-chip[data-cat="우수 활용팁 공유"].active{ background:var(--tip-tag); }
  .refresh-btn{
    margin-left:auto; flex:0 0 auto;
    width:34px; height:34px; border-radius:50%;
    border:1.5px solid #D8DEE9; background:#fff; color:var(--muted);
    font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform .3s ease;
  }
  .refresh-btn:active{ transform:rotate(180deg); }

  .state-msg{
    text-align:center; color:var(--muted); font-size:13.5px;
    padding:50px 20px; line-height:1.6;
  }
  .state-msg.error{ color:var(--danger); }
  .state-msg a{ color:var(--accent); font-weight:700; text-decoration:none; }
  .state-msg a:hover{ text-decoration:underline; }
  .retry-btn{
    margin-top:12px; padding:8px 16px; border-radius:8px; border:none;
    background:var(--accent); color:#fff; font-weight:700; font-size:12.5px; cursor:pointer;
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:14px;
  }
  @media (min-width:560px){ .card-grid{ grid-template-columns:repeat(3, 1fr); } }
  @media (min-width:820px){ .card-grid{ grid-template-columns:repeat(4, 1fr); } }

  .fcard{
    position:relative;
    aspect-ratio:3 / 4;
    perspective:1000px;
    border:none; background:none; padding:0; cursor:pointer;
  }
  .pin{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:13px; height:13px; border-radius:50%; z-index:3;
    background:radial-gradient(circle at 35% 30%, #ffffff, var(--accent) 55%, #2b3690 100%);
    box-shadow:0 3px 6px rgba(31,41,55,.3);
  }
  .fcard-inner{
    position:relative; width:100%; height:100%;
    transition:transform .55s cubic-bezier(.2,.8,.2,1);
    transform-style:preserve-3d;
  }
  .fcard.flipped .fcard-inner{ transform:rotateY(180deg); }

  .fcard-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:13px; padding:13px;
    display:flex; flex-direction:column;
    box-shadow:0 10px 20px rgba(31,41,55,.14);
    text-align:left;
  }
  .fcard-face.front{ color:#fff; justify-content:space-between; }
  .fcard[data-cat="오류사항"] .front{ background:var(--error-tag); }
  .fcard[data-cat="개선요청"] .front{ background:var(--improve-tag); }
  .fcard[data-cat="기타"] .front{ background:var(--etc-tag); }
  .fcard[data-cat="우수 활용팁 공유"] .front{ background:var(--tip-tag); }

  .fcard-icon{ font-size:22px; }
  .fcard-cat{ font-size:12.5px; font-weight:800; margin-top:6px; line-height:1.3; }
  .fcard-meta{ font-family:'JetBrains Mono', monospace; font-size:9.5px; opacity:.9; line-height:1.6; }
  .fcard-hint{ font-family:'JetBrains Mono', monospace; font-size:9px; opacity:.75; text-align:right; }

  .fcard-face.back{
    background:#fff; color:var(--ink);
    border:1.5px solid #E3E7EF;
    transform:rotateY(180deg);
    justify-content:space-between;
  }
  .fcard-content{
    font-size:11.5px; line-height:1.55;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .fcard-back-meta{
    font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--muted);
    border-top:1px dashed #E3E7EF; padding-top:6px; margin-top:6px;
  }

  .footer-note{
    text-align:center; font-family:'JetBrains Mono', monospace;
    font-size:10.5px; color:var(--muted); margin-top:32px; letter-spacing:.02em;
  }
  .footer-note a{ color:var(--accent); font-weight:700; text-decoration:none; }
  .footer-note a:hover{ text-decoration:underline; }

  @media (prefers-reduced-motion: reduce){
    .fcard-inner{ transition:none; }
    .refresh-btn{ transition:none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">SUGGESTION BOX ARCHIVE · 창순기획</div>
  <h1>피드백 게시판</h1>
  <p class="subtitle">그동안 쌓인 의견을 카드로 확인해 보세요. 카드를 탭하면 뒤집혀요.</p>

  <div class="controls" id="controls">
    <button class="filter-chip active" data-cat="전체">전체</button>
    <button class="filter-chip" data-cat="오류사항">🐛 오류사항</button>
    <button class="filter-chip" data-cat="개선요청">💡 개선요청</button>
    <button class="filter-chip" data-cat="기타">💬 기타</button>
    <button class="filter-chip" data-cat="우수 활용팁 공유">⭐ 우수 활용팁</button>
    <button class="refresh-btn" id="refresh-btn" title="새로고침" aria-label="새로고침">↻</button>
  </div>

  <div id="content-area">
    <div class="state-msg" id="loading-msg">불러오는 중...</div>
  </div>

  <div class="footer-note">창순기획 · <a href="index.html">피드백 남기기 →</a></div>
</div>

<script>
(function(){
  // ⚠ index.html과 동일한 Apps Script 배포 URL(.../exec)로 교체하세요.
  const WEB_APP_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

  const CATEGORY_META = {
    '오류사항': { icon: '🐛' },
    '개선요청': { icon: '💡' },
    '기타': { icon: '💬' },
    '우수 활용팁 공유': { icon: '⭐' }
  };

  const contentArea = document.getElementById('content-area');
  const controls = document.getElementById('controls');
  const refreshBtn = document.getElementById('refresh-btn');

  let allItems = [];
  let currentFilter = '전체';

  function formatDate(iso){
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mi = String(d.getMinutes()).padStart(2, '0');
    return mm + '.' + dd + ' ' + hh + ':' + mi;
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderEmpty(){
    contentArea.innerHTML = '<div class="state-msg">아직 등록된 의견이 없어요.<br>' +
      '<a href="index.html">첫 피드백을 남겨보세요 →</a></div>';
  }

  function renderError(){
    contentArea.innerHTML = '<div class="state-msg error">불러오는 데 실패했어요. 네트워크 상태를 확인해 주세요.<br>' +
      '<button class="retry-btn" id="retry-btn">다시 시도</button></div>';
    document.getElementById('retry-btn').addEventListener('click', load);
  }

  function renderCards(){
    const items = currentFilter === '전체'
      ? allItems
      : allItems.filter(it => it.category === currentFilter);

    if (items.length === 0){
      contentArea.innerHTML = '<div class="state-msg">해당 카테고리의 의견이 아직 없어요.</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'card-grid';

    items.forEach((item, idx) => {
      const meta = CATEGORY_META[item.category] || { icon: '💬' };
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'fcard';
      card.dataset.cat = item.category;
      card.setAttribute('aria-pressed', 'false');
      card.setAttribute('aria-label', item.category + ' 카드, 탭하여 내용 보기');
      card.innerHTML =
        '<span class="pin"></span>' +
        '<span class="fcard-inner">' +
          '<span class="fcard-face front">' +
            '<span class="fcard-icon">' + meta.icon + '</span>' +
            '<span>' +
              '<span class="fcard-cat">' + escapeHtml(item.category) + '</span>' +
              '<span class="fcard-meta">' + escapeHtml(item.name) + ' · ' + formatDate(item.timestamp) + '</span>' +
            '</span>' +
            '<span class="fcard-hint">탭해서 보기 ›</span>' +
          '</span>' +
          '<span class="fcard-face back">' +
            '<span class="fcard-content">' + escapeHtml(item.content) + '</span>' +
            '<span class="fcard-back-meta">' + escapeHtml(item.name) + ' · ' + formatDate(item.timestamp) + '</span>' +
          '</span>' +
        '</span>';

      card.addEventListener('click', () => {
        const flipped = card.classList.toggle('flipped');
        card.setAttribute('aria-pressed', String(flipped));
      });

      grid.appendChild(card);
    });

    contentArea.innerHTML = '';
    contentArea.appendChild(grid);
  }

  function load(){
    contentArea.innerHTML = '<div class="state-msg">불러오는 중...</div>';

    if (WEB_APP_URL.indexOf('YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') !== -1){
      contentArea.innerHTML = '<div class="state-msg error">관리자 설정이 필요합니다 (WEB_APP_URL 미설정).</div>';
      return;
    }

    fetch(WEB_APP_URL + '?action=list')
      .then(res => res.json())
      .then(data => {
        if (!data.success){
          renderError();
          return;
        }
        allItems = data.items || [];
        if (allItems.length === 0){
          renderEmpty();
        } else {
          renderCards();
        }
      })
      .catch(renderError);
  }

  controls.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      controls.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.cat;
      if (allItems.length > 0) renderCards();
    });
  });

  refreshBtn.addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
