<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>창순기획 피드백 전송</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#060B14;
    --panel: rgba(13,23,38,.72);
    --cyan:#4CF3FF;
    --cyan-soft: rgba(76,243,255,.35);
    --ink:#E7FBFF;
    --muted:#6F8CA0;
    --err:#FF4B5C;
    --improve:#33F0B8;
    --etc:#9AA8FF;
    --tip:#FFC94C;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
    background:var(--void);
    overflow-x:hidden;
    padding:34px 16px 60px;
    position:relative;
  }

  .hud-bg{
    position:fixed; inset:0; z-index:-1; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(76,243,255,.14), transparent 55%),
      repeating-linear-gradient(0deg, rgba(76,243,255,.035) 0px, rgba(76,243,255,.035) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(76,243,255,.03) 0px, rgba(76,243,255,.03) 1px, transparent 1px, transparent 42px),
      var(--void);
  }
  .hud-bg::after{
    content:'';
    position:absolute; left:0; right:0; top:-140px; height:140px;
    background:linear-gradient(180deg, transparent, rgba(76,243,255,.16), transparent);
    animation:scan 7s linear infinite;
  }
  @keyframes scan{ 0%{ top:-140px; } 100%{ top:100%; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }

  .page{ max-width:460px; margin:0 auto; }

  .hud-tag{
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    letter-spacing:.18em; color:var(--cyan); text-align:center;
    text-shadow:0 0 10px var(--cyan-soft);
  }
  h1{
    text-align:center; font-weight:800; font-size:26px; margin:8px 0 10px; letter-spacing:-.01em;
    background:linear-gradient(90deg,#fff,var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(76,243,255,.35));
  }
  .hud-status{
    text-align:center; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);
    display:flex; justify-content:center; align-items:center; gap:7px; margin-bottom:26px;
  }
  .dot{
    width:7px; height:7px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 8px 2px var(--cyan-soft); animation:pulse 1.6s ease-in-out infinite;
  }

  .panel-frame{
    position:relative;
    background:var(--panel); border:1px solid rgba(76,243,255,.25); border-radius:16px;
    backdrop-filter:blur(6px);
    box-shadow:0 0 40px -14px rgba(76,243,255,.3), inset 0 0 40px -22px rgba(76,243,255,.2);
    padding:28px 22px 26px; margin-bottom:20px;
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  .panel-frame.alert{
    border-color:rgba(255,75,92,.5);
    box-shadow:0 0 40px -14px rgba(255,75,92,.35), inset 0 0 40px -22px rgba(255,75,92,.2);
  }
  .corner{ position:absolute; width:18px; height:18px; border:2px solid var(--cyan); opacity:.85; }
  .corner.tl{ top:-1px; left:-1px; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  .corner.tr{ top:-1px; right:-1px; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
  .corner.bl{ bottom:-1px; left:-1px; border-right:none; border-top:none; border-radius:0 0 0 6px; }
  .corner.br{ bottom:-1px; right:-1px; border-left:none; border-top:none; border-radius:0 0 6px 0; }

  fieldset{ border:none; padding:0; margin:0 0 22px; }
  legend{ padding:0; width:100%; }
  .field-block{ margin-bottom:22px; }

  .field-label{
    display:flex; align-items:baseline; gap:6px;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; font-weight:700; letter-spacing:.03em;
    color:var(--muted); text-transform:uppercase; margin:0 0 10px;
  }
  .field-label .req{ color:var(--err); font-size:11px; }
  .field-label .opt{
    font-family:'JetBrains Mono', monospace; font-size:9.5px; font-weight:500; color:var(--muted);
    background:rgba(76,243,255,.08); border:1px solid rgba(76,243,255,.15);
    padding:2px 7px; border-radius:5px; text-transform:none;
  }

  .category-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hud-chip-lg{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace; font-size:12.5px; font-weight:700; letter-spacing:.02em;
    color:var(--muted); background:rgba(6,14,24,.55); border:1.5px solid rgba(76,243,255,.16);
    padding:16px 10px; border-radius:12px; cursor:pointer;
    transition:color .2s ease, border-color .2s ease, transform .15s ease, box-shadow .2s ease;
  }
  .hud-chip-lg .ic{ font-size:20px; }
  .hud-chip-lg[data-cat="오류사항"]{ --c: var(--err); }
  .hud-chip-lg[data-cat="개선요청"]{ --c: var(--improve); }
  .hud-chip-lg[data-cat="기타"]{ --c: var(--etc); }
  .hud-chip-lg[data-cat="우수 활용팁 공유"]{ --c: var(--tip); }
  .hud-chip-lg:hover{ color:var(--ink); border-color:var(--cyan-soft); }
  .hud-chip-lg.selected{
    color:var(--c); border-color:var(--c); transform:translateY(-2px);
    box-shadow:0 0 20px -6px var(--c), inset 0 0 16px -10px var(--c);
  }
  .hud-chip-lg.selected::before{
    content:''; position:absolute; inset:-3px; border-radius:14px; z-index:-1; opacity:.5;
    background:conic-gradient(from 0deg, transparent 0 70%, var(--c) 88%, transparent 100%);
    animation:spin 2.6s linear infinite;
  }
  .hud-chip-lg:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  .hud-input{
    width:100%; font-family:'Pretendard', sans-serif; font-size:14.5px; color:var(--ink);
    background:rgba(6,14,24,.6); border:1.5px solid rgba(76,243,255,.18); border-radius:10px;
    padding:12px 13px; resize:none; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .hud-input::placeholder{ color:var(--muted); }
  .hud-input:focus{
    outline:none; border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(76,243,255,.12), 0 0 20px -8px var(--cyan-soft);
  }
  textarea.hud-input{ min-height:132px; line-height:1.6; }

  .counter{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);
    text-align:right; margin-top:6px;
  }
  .counter.warn{ color:var(--err); }

  .hp-field{ position:absolute; left:-9999px; top:-9999px; opacity:0; }

  .hud-btn{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13px; letter-spacing:.03em;
    padding:14px 22px; border-radius:10px; cursor:pointer; border:none;
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease, opacity .15s ease;
  }
  .hud-btn.full{ display:block; width:100%; text-align:center; text-decoration:none; }
  .hud-btn.primary{
    background:linear-gradient(135deg, var(--cyan), #1B8FA6); color:#01202A;
    box-shadow:0 0 26px -6px var(--cyan-soft);
  }
  .hud-btn.primary:hover{ transform:translateY(-2px); filter:brightness(1.05); }
  .hud-btn.primary:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  .hud-btn.ghost{
    background:transparent; border:1.5px solid rgba(76,243,255,.4); color:var(--cyan);
  }
  .hud-btn.ghost:hover{ background:rgba(76,243,255,.08); transform:translateY(-1px); }

  .status-msg{
    display:none; margin-top:16px; padding:12px 14px; border-radius:10px;
    font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600; line-height:1.6;
    border:1px solid transparent;
  }
  .status-msg.show{ display:block; }
  .status-msg.ok{
    background:rgba(51,240,184,.08); color:var(--improve); border-color:rgba(51,240,184,.3);
    box-shadow:0 0 20px -10px rgba(51,240,184,.4);
  }
  .status-msg.error{
    background:rgba(255,75,92,.08); color:var(--err); border-color:rgba(255,75,92,.3);
    box-shadow:0 0 20px -10px rgba(255,75,92,.4);
  }

  .footer-note{
    text-align:center; font-family:'JetBrains Mono', monospace; font-size:10.5px;
    color:var(--muted); margin-top:20px; letter-spacing:.02em;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="hud-bg"></div>
<div class="page">
  <div class="hud-tag">◈ F.E.E.D — TRANSMIT PROTOCOL</div>
  <h1>피드백 전송</h1>
  <div class="hud-status"><span class="dot"></span>SYSTEM ONLINE · 익명 제출 가능</div>

  <div class="panel-frame" id="panel-frame">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <form id="feedback-form" novalidate>
      <fieldset>
        <legend class="field-label">카테고리 <span class="req">*</span></legend>
        <div class="category-grid" id="category-grid" role="radiogroup" aria-label="카테고리 선택">
          <button type="button" class="hud-chip-lg" data-cat="오류사항" role="radio" aria-checked="false">
            <span class="ic">🐛</span>오류사항
          </button>
          <button type="button" class="hud-chip-lg" data-cat="개선요청" role="radio" aria-checked="false">
            <span class="ic">💡</span>개선요청
          </button>
          <button type="button" class="hud-chip-lg" data-cat="기타" role="radio" aria-checked="false">
            <span class="ic">💬</span>기타
          </button>
          <button type="button" class="hud-chip-lg" data-cat="우수 활용팁 공유" role="radio" aria-checked="false">
            <span class="ic">⭐</span>우수 활용팁 공유
          </button>
        </div>
      </fieldset>

      <div class="field-block">
        <label class="field-label" for="name-input">이름 <span class="opt">선택 · 익명 가능</span></label>
        <input type="text" id="name-input" class="hud-input" maxlength="30" placeholder="예: 교육연구부 / 박OO (비워도 됨)">
      </div>

      <div class="field-block">
        <label class="field-label" for="content-input">내용 <span class="req">*</span></label>
        <textarea id="content-input" class="hud-input" maxlength="2000" placeholder="어떤 부분이 불편했는지, 어떻게 바뀌면 좋을지 자유롭게 적어 주세요."></textarea>
        <div class="counter" id="char-counter">0 / 2000</div>
      </div>

      <!-- 스팸 방지용 허니팟: 사람 눈에는 보이지 않음 -->
      <div class="hp-field" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" class="hud-btn primary full" id="submit-btn">전송하기</button>

      <div class="status-msg" id="status-msg" role="status"></div>
    </form>
  </div>

  <a class="hud-btn ghost full" href="board.html">📡 응답 아카이브 열람 →</a>

  <div class="footer-note">창순기획 · 익명 제출 가능</div>
</div>

<script>
(function(){
  // ⚠ Apps Script 배포 후 발급되는 웹앱 URL(.../exec)로 반드시 교체하세요.
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxZDKg89JG7Ur_hiT61AFrzyPrX6s9pWfIL9uFhSGvlCkBH6uMZx1O2iRkrHjE37KS6yw/exec';

  const grid = document.getElementById('category-grid');
  const catButtons = Array.from(grid.querySelectorAll('.hud-chip-lg'));
  const form = document.getElementById('feedback-form');
  const nameInput = document.getElementById('name-input');
  const contentInput = document.getElementById('content-input');
  const counter = document.getElementById('char-counter');
  const submitBtn = document.getElementById('submit-btn');
  const statusMsg = document.getElementById('status-msg');
  const panelFrame = document.getElementById('panel-frame');
  const honeypot = document.getElementById('website');

  let selectedCategory = '';

  catButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      catButtons.forEach(b => { b.classList.remove('selected'); b.setAttribute('aria-checked','false'); });
      btn.classList.add('selected');
      btn.setAttribute('aria-checked','true');
      selectedCategory = btn.dataset.cat;
    });
  });

  contentInput.addEventListener('input', () => {
    const len = contentInput.value.length;
    counter.textContent = len + ' / 2000';
    counter.classList.toggle('warn', len > 1900);
  });

  function showStatus(type, message){
    statusMsg.textContent = message;
    statusMsg.className = 'status-msg show ' + type;
    panelFrame.classList.toggle('alert', type === 'error');
  }

  function resetForm(){
    form.reset();
    catButtons.forEach(b => { b.classList.remove('selected'); b.setAttribute('aria-checked','false'); });
    selectedCategory = '';
    counter.textContent = '0 / 2000';
    counter.classList.remove('warn');
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    statusMsg.className = 'status-msg';
    panelFrame.classList.remove('alert');

    if (!selectedCategory){
      showStatus('error', '카테고리를 선택해 주세요.');
      return;
    }
    const content = contentInput.value.trim();
    if (!content){
      showStatus('error', '내용을 입력해 주세요.');
      return;
    }
    if (WEB_APP_URL.indexOf('YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') !== -1){
      showStatus('error', '관리자 설정이 필요합니다 (WEB_APP_URL 미설정).');
      return;
    }

    const payload = {
      category: selectedCategory,
      name: nameInput.value.trim(),
      content: content,
      website: honeypot.value
    };

    submitBtn.disabled = true;
    submitBtn.textContent = '전송 중...';

    fetch(WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
      .then(res => res.json())
      .then(data => {
        if (data.success){
          showStatus('ok', '전송 완료. 소중한 의견 감사합니다!');
          resetForm();
        } else {
          showStatus('error', data.message || '전송 중 오류가 발생했습니다. 다시 시도해 주세요.');
        }
      })
      .catch(() => {
        showStatus('error', '네트워크 오류로 전송하지 못했습니다. 잠시 후 다시 시도해 주세요.');
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = '전송하기';
      });
  });
})();
</script>
</body>
</html>
